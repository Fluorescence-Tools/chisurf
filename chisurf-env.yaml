name: chisurf-env
channels:
  - conda-forge
dependencies:
  - python=3.12.*
  - pip
  - numpy<2.0
  - boost-cpp
  - pyqt
  - typing-extensions>=4.14
  - pytools>=2024.0
  - pyyaml
  - markdown
  - click
  - click-didyoumean
  - qtpy
  - pyqtgraph
  - matplotlib
  - scikit-image
  # Imaging I/O for RICS/ICS TIFF stacks (imagecodecs decodes LZW-compressed
  # TIFFs for tifffile; pillow is the multi-frame fallback).
  - imageio
  - tifffile
  - imagecodecs
  - pillow
  - deprecation
  - pandas
  - scipy
  - numba
  - mdtraj
  - ipython
  - notebook<7
  - emcee
  - pyopengl
  - pytables
  - guidata
  - python-docx
  - qtconsole
  - hmmlearn
  - pygments
  - pyarrow-core
  - boost-histogram
  - hdf5
  - pip:
      - latexify-py
