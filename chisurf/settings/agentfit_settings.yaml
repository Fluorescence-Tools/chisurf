# Agent-based Fit Model Settings
# This file contains the settings for the agent-based fitting algorithm

# Maximum number of iterations for the agent
max_iterations: 100

# Initial step size for parameter changes
step_size: 0.1

# Rate at which step size decreases
cooling_rate: 0.99

# Convergence tolerance for chi-squared improvement
tolerance: 0.00001

# Ratio of exploration vs exploitation (0-1)
explore_exploit_ratio: 0.3

# Number of parameter changes to remember for sensitivity analysis
sensitivity_memory: 10

# How often to perform a fit (every N iterations, 0 = never)
fit_frequency: 5