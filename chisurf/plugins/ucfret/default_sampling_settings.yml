# Default settings for UCFRET sampling

init: # Parameters that initialize the DecaySampler class
  tauD0: 4.0 # Fluorescence lifetime of the donor in the absence of FRET
  forster_radius: 52.0 # Forster radius of the DA pair (match the QY of tauD0)
  n_axis_bins: 64 # Number of distance bins
  fret_efficiency_bounds: [0.01, 0.99999999] # Minimum and maximum FRET efficiency
  sigma_range: [3.0, 6.0] # Allowed range of sigma in the Chi distributions
  scatter_range:  [0.0, 1.0] # Allowed range for the scatter fraction
  background_range: [0.0, null] # Allowed range for the background in the decay
  time_shift_range: [-10.0, 10.0] # Allowed range of the time shifts
  lifetime_range: [0., 6.0] # Allowed range of the donor fluorescence lifetimes (in absence of FRET)
  sample_d0: False # If set to True also sample the donor fluorescence decay
  verbose: 1 # Verbosity level

sample:
  nsteps: 50 # Number of MCMC steps (increase for production runs)
  thin: 1 # Used to thin the MCMC chain
  steps_per_write: 50 # Number of steps before results are written to HDF5
  n_proc: null # Number of processes (if null all cores are used)
  walker_per_dim: 2 # Should be at least 2
  verbose: 1 # If set to 0 less output
  new_run: true # If false continue existing sample else start new sample

analyze:
  burn_in: 30 # Number of frames that are are not considered in the posterior
  n_best: 3 # For plotting of the n best distance distributions
  thin: 2 # Used to thin the sampled chain
  verbose: 1 # Verbosity level
  n_amplitude_bins: 512 # Number of species fraction bins
  n_axis_bins: 512 # Number of distance axis bins
  plot_2d_vmax: 50 # For plotting of density (above 50 white)
  plot_2d_vmin: 10 # Smallest bin value (black)