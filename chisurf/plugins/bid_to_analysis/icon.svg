<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd88a"/>
      <stop offset="100%" stop-color="#f0b74a"/>
    </linearGradient>
    <linearGradient id="gradArrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" rx="16" ry="16" fill="#1e1e1e"/>

  <!-- BID chip -->
  <g transform="translate(10,10)" filter="url(#shadow)">
    <rect x="0" y="0" width="44" height="28" rx="6" ry="6" fill="#2d3b55" stroke="#a6c8ff" stroke-width="2"/>
    <text x="22" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a6c8ff" font-weight="700">BID</text>
  </g>

  <!-- Arrow to folder -->
  <g transform="translate(58,34)" filter="url(#shadow)">
    <path d="M0,22 L34,22 L34,12 L56,28 L34,44 L34,34 L0,34 Z" fill="url(#gradArrow)" stroke="#1b5e20" stroke-width="2"/>
  </g>

  <!-- Analysis folder -->
  <g transform="translate(28,58)" filter="url(#shadow)">
    <!-- Tab -->
    <path d="M8,0 h24 l6,8 h38 a6,6 0 0 1 6,6 v40 a8,8 0 0 1 -8,8 h-88 a8,8 0 0 1 -8,-8 v-38 a8,8 0 0 1 8,-8 h14 z" fill="url(#gradFolder)" stroke="#b07b23" stroke-width="2"/>
    <!-- Analysis bars -->
    <rect x="20" y="26" width="10" height="22" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="36" y="18" width="10" height="30" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="52" y="30" width="10" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="68" y="22" width="10" height="26" rx="2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
