    <b>FRET Efficiency &rarr; PDA <i>p</i><sub>0</sub></b><br/>
    Calculates the peak position <i>p</i><sub>0</sub> in Photon Distribution Analysis (PDA) from FRET efficiency <i>E</i>, donor/acceptor quantum yields, and instrument detection factor <i>g</i>.<br/>
    <br/>
    <b>Parameters:</b><br/>
    &nbsp;&nbsp;&bull;&nbsp;<i>&phi;</i><sub>A</sub>, <i>&phi;</i><sub>D</sub>: Acceptor and donor fluorescence quantum yields<br/>
    &nbsp;&nbsp;&bull;&nbsp;<i>g</i>: Instrument detection efficiency ratio<br/>
    &nbsp;&nbsp;&bull;&nbsp;<i>a</i>: Correction factor for background/crosstalk<br/>
    <br/>
    <b>Equation:</b><br/>
    <i>p</i><sub>0</sub> = 1 - [1 + (<i>&phi;</i><sub>A</sub>/<i>&phi;</i><sub>D</sub>) &middot; (1/<i>g</i>) &middot; (<i>E</i> / (1 - <i>E</i>)) + <i>a</i>]<sup>-1</sup>
