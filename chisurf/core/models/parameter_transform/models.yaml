    Computes the mean FRET efficiency by integrating over a generalized Gaussian distance distribution with mean <i>R</i><sub>DA</sub>, width <i>s</i><sub>DA</sub>, and skewness parameter <i>k</i>.<br/>
    <br/>
    <b>Equation:</b><br/>
