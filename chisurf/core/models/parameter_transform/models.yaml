  description: |
    <b>Accessible Volume (Gaussian approx) &rarr; R<sub>DA</sub>, d<sub>RDAE</sub>, E</b><br/>
    Approximates donor and acceptor accessible volumes (AVs) as 3D isotropic Gaussians with standard deviations <i>s</i><sub>D</sub> and <i>s</i><sub>A</sub>.<br/>
    The distance vector <b>R</b> follows a 3D Gaussian: <b>R</b> ~ <i>N</i>(<b>R</b><sub>mp</sub>, <i>&sigma;</i><sup>2</sup> <b>I</b><sub>3</sub>) with <i>&sigma;</i><sup>2</sup> = <i>s</i><sub>D</sub><sup>2</sup> + <i>s</i><sub>A</sub><sup>2</sup>.<br/>
    The scalar distance <i>D</i> follows a non-central chi distribution.<br/>
    Calculates expectation values:<br/>
    &nbsp;&nbsp;&bull;&nbsp;Mean distance: <i>R</i><sub>DA</sub> = &langle;<i>D</i>&rangle;<br/>
    &nbsp;&nbsp;&bull;&nbsp;Mean FRET efficiency: <i>E</i> = &langle;1 / (1 + (<i>D</i>/<i>R</i><sub>0</sub>)<sup>6</sup>)&rangle;<br/>
    &nbsp;&nbsp;&bull;&nbsp;FRET-averaged distance: <i>d</i><sub>RDAE</sub> = <i>R</i><sub>0</sub> &middot; [(1/<i>E</i>) - 1]<sup>1/6</sup>
