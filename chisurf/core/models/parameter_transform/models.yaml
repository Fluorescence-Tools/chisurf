Accessible Volume (Gaussian approx)->RDA, dRDAE, E:
  code: >
    def g(dRmp, sD, sA, R0):
        # Mathematical Explanation:
        # AVs are approximated as 3D isotropic Gaussians with standard deviations sD and sA.
        # The vector distance R = rA - rD follows a 3D Gaussian N(Rmp, sigma^2 * I_3) 
        # where sigma^2 = sD^2 + sA^2. The scalar distance D = |R| follows a distribution 
        # where (D/sigma)^2 is non-central chi-squared distributed with 3 degrees of freedom 
        # and non-centrality parameter lambda = (dRmp/sigma)^2.
        # We calculate expectation values for RDA (mean distance), dRDAE (FRET-averaged distance), 
        # and E (mean FRET efficiency) over this distribution.
        
        import numpy as np
        from scipy.stats import ncx2
        
        sigma = np.sqrt(sD**2 + sA**2)
        if sigma < 1e-10:
            E = 1.0 / (1.0 + (dRmp / max(R0, 1e-10))**6) if R0 > 0 else 0.0
            return {'RDA': float(dRmp), 'dRDAE': float(dRmp), 'E': float(E)}
            
        nc = (dRmp / sigma)**2
        x = np.linspace(max(0.1, dRmp - 8*sigma), dRmp + 8*sigma, 1000)
        x2_scaled = (x / sigma)**2
        pdf = ncx2.pdf(x2_scaled, df=3, nc=nc) * (2.0 * x / sigma**2)
        
        pdf_sum = np.sum(pdf)
        if pdf_sum > 0:
            pdf /= pdf_sum
        else:
            pdf = np.zeros_like(x)
            idx = np.argmin(np.abs(x - dRmp))
            pdf[idx] = 1.0
            
        RDA = np.sum(x * pdf)
        E_array = 1.0 / (1.0 + (x / max(R0, 1e-10))**6)
        mean_E = np.sum(E_array * pdf)
        
        if 0 < mean_E < 1:
            dRDAE = R0 * ((1.0 / mean_E) - 1.0)**(1.0/6.0)
        elif mean_E >= 1:
            dRDAE = 0.0
        else:
            dRDAE = 1e6
            
        return {
            'RDA': float(RDA),
            'dRDAE': float(dRDAE),
            'E': float(mean_E)
        }

