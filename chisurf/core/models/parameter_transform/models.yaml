    def g(k12, k21):
      # Prevent division by zero
      denominator = k12 + k21
      if abs(denominator) < 1e-10:
        # If denominator is too close to zero, return default values
        return {
          'tR': 1e9,  # "Infinite" relaxation time
          'x1': 0.5,  # Equal populations
          'x2': 0.5
        }

      return {
        'tR': 1. / denominator,
        'x1': k21 / denominator,
        'x2': k12 / denominator   
      }
