    def g(E, sD, sA, R0):
        # Inverse transform: Find dRmp that yields the target E, then compute RDA and dRDAE
        import numpy as np
        from scipy.stats import ncx2
        from scipy.optimize import root_scalar
        
        def _compute(dRmp):
            sigma = np.sqrt(sD**2 + sA**2)
            if sigma < 1e-10:
                return float(dRmp), float(dRmp), (1.0 / (1.0 + (dRmp / max(R0, 1e-10))**6) if R0 > 0 else 0.0)
            nc = (dRmp / sigma)**2
            x = np.linspace(max(0.1, dRmp - 8*sigma), dRmp + 8*sigma, 1000)
            pdf = ncx2.pdf((x / sigma)**2, df=3, nc=nc) * (2.0 * x / sigma**2)
            pdf_sum = np.sum(pdf)
            if pdf_sum > 0: pdf /= pdf_sum
            else:
                pdf = np.zeros_like(x)
                pdf[np.argmin(np.abs(x - dRmp))] = 1.0
            rda = np.sum(x * pdf)
            mean_e = np.sum((1.0 / (1.0 + (x / max(R0, 1e-10))**6)) * pdf)
            drdae = R0 * ((1.0 / mean_e) - 1.0)**(1.0/6.0) if 0 < mean_e < 1 else (0.0 if mean_e >= 1 else 1e6)
            return float(rda), float(drdae), float(mean_e)

        def objective(dRmp):
            _, _, e = _compute(dRmp)
            return e - E
            
        try:
            res = root_scalar(objective, bracket=[0.0, 200.0])
            dRmp = res.root
        except ValueError:
            dRmp = R0 * ((1.0 / max(1e-10, E)) - 1.0)**(1.0/6.0) # Fallback if root not found in bracket
            
        RDA, dRDAE, _ = _compute(dRmp)
        return {'dRmp': float(dRmp), 'RDA': float(RDA), 'dRDAE': float(dRDAE)}

