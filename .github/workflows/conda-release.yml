name: Build and Upload Conda Packages

on:
  workflow_dispatch:
  push:
    branches: [ development ]
  release:
    types: [ released, prereleased ]
  schedule:
    # Every Monday at 11:00 UTC
    - cron: "0 11 * * 1"

jobs:
  build:
    name: CondaBuild (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ] # add macos-latest / windows-latest if you like
        python-version: [ "3.10" ]

    env:
      OUT_DIR: conda-bld
      ANACONDA_USER: tpeulen
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

    steps:
      - name: Free Disk Space (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "Set SDK on macOS (if needed)"
        if: startsWith(matrix.os, 'macos')
        run: build_tools/install_macos_sdk.sh

      - name: Set up micromamba (conda-forge strict)
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          environment-name: build
          create-args: >-
            python=${{ matrix.python-version }}
            boa
            conda-build
            anaconda-client
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict

      - name: Display Conda Settings
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort

      - name: Fetch conda-forge pinning (conda_build_config.yaml)
        shell: bash
        run: |
          echo "Fetching conda-forge pinning config…"
          curl -fsSL \
            https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/main/recipe/conda_build_config.yaml \
            -o conda_build_config.yaml
          echo "Pinning config head:"
          head -n 12 conda_build_config.yaml

      - name: Derive VERSION (tag on release; else git describe)
        shell: bash -l {0}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --dirty --always || true)
          fi
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # choose label
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "UPLOAD_LABEL=main" >> $GITHUB_ENV
          else
            echo "UPLOAD_LABEL=dev" >> $GITHUB_ENV
          fi

      - name: Build (mambabuild)
        shell: bash -l {0}
        working-directory: conda-recipe
        run: |
          conda mambabuild . \
            --variant-config-files ../conda_build_config.yaml \
            --output-folder "$GITHUB_WORKSPACE/${OUT_DIR}"

      - name: Upload to Anaconda.org (if token present)
        if: ${{ env.ANACONDA_TOKEN != '' }}
        shell: bash -l {0}
        run: |
          anaconda -t "${ANACONDA_TOKEN}" upload \
            -u "${ANACONDA_USER}" \
            --label "${UPLOAD_LABEL}" \
            --force ${OUT_DIR}/**/*.tar.bz2

      - name: Keep built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ env.OUT_DIR }}/**/*.tar.bz2
