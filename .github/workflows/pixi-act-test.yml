name: Pixi Act Smoke

on:
  workflow_dispatch:

env:
  PIXI_VERSION: latest
  QT_QPA_PLATFORM: offscreen

jobs:
  act-linux:
    name: Linux smoke (Pixi)
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb libgl1-mesa-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          locked: false

      - name: Smoke tests (headless)
        run: xvfb-run -a pixi run test-smoke
