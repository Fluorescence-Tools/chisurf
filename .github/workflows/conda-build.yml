name: Build and Publish Conda Package

on:
  push:
    tags:
      - 'v*.*.*'      # triggers on version tags like v1.2.3
  workflow_dispatch:  # allows manual runs

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          # remove fixed Python version to use default
          auto-update-conda: true       # update conda to latest
          activate-environment: base    # activate the base environment
          miniconda-version: latest     # install latest Miniconda
          channels: conda-forge, bioconda  # add bioconda & conda-forge
          channel-priority: strict        # enforce strict priority order

      - name: Download conda_build_config.yaml
        shell: bash
        run: |
          echo "Fetching conda-forge’s pinning config…"
          curl -sSL \
            https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/master/recipe/conda_build_config.yaml \
            -o conda_build_config.yaml
          echo "Pinning config version:"
          head -n 5 conda_build_config.yaml

      - name: Install build tools
        run: |
          conda install --yes conda-build anaconda-client

      - name: Build conda package
        run: |
          conda build conda-recipe

      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          # Get the built package path
          PACKAGE=$(conda build --output conda-recipe)
          # Upload to your Anaconda user/channel
          anaconda -t "$ANACONDA_API_TOKEN" upload --user YOUR_USERNAME --label main "$PACKAGE"
