name: Conda Build

on:
  workflow_dispatch:
  push:
    branches:
      - development
  release:
    types: ['released', 'prereleased']
  schedule:
    # Every Monday at 11PM UTC
    - cron: "0 23 * * 1"

jobs:
  build:
    name: CondaBuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"] # "ubuntu-latest"] #, "macos-latest"] #,
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Download conda_build_config.yaml
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "Fetching conda-forge’s pinning config…"
          curl -sSL \
            https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/master/recipe/conda_build_config.yaml \
            -o conda_build_config.yaml
          echo "Pinning config version:"
          head -n 5 conda_build_config.yaml

      - name: Download conda_build_config.yaml (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Fetching conda-forge’s pinning config…"
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/master/recipe/conda_build_config.yaml' `
            -OutFile conda_build_config.yaml -UseBasicParsing
          Write-Host "Pinning config version:"
          Get-Content conda_build_config.yaml -TotalCount 5

      - name: "Set SDK on MacOS (if needed)"
        if: startsWith(matrix.os, 'macos')
        run: build_tools/install_macos_sdk.sh

      - name: Install Visual Studio 2017 (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install visualstudio2017buildtools --version=15.9.54 -y
          choco install visualstudio2017-workload-vctools -y
          setx PATH "%PATH%;C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\VC\Auxiliary\Build"

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          conda-remove-defaults: true
          miniforge-version: latest
          channels: conda-forge,bioconda,tpeulen
          channel-priority: true
          activate-environment: base

      - name: Display Conda Settings
        shell: bash -el {0}
        run: |
          conda info

      - name: Build + Upload Conda Package
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          # 1) install everything we need
          mamba install -y boa conda-build anaconda-client

          # 2) build with boa (faster than `conda build`, and works cross-platform)
          mamba run -n base boa build conda-recipe

          # 3) grab the exact artifact path via the conda-build binary
          PKG_PATH=$(mamba run -n base conda-build conda-recipe --output)

          # 4) upload via the Anaconda client
          mamba run -n base anaconda -t "$ANACONDA_TOKEN" upload --user tpeulen --skip-existing "$PKG_PATH"