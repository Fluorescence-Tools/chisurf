name: Conda Build

on:
  workflow_dispatch:
  push:
    branches:
      - development    # keep if you really use 'development'
      - main           # ← add your default branch here
  release:
    types: [published, prereleased]  # use 'published', not 'released'
  schedule:
    - cron: "0 23 * * 1"  # Every Monday at 11PM UTC

jobs:
  build:
    name: CondaBuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]  # re-enable ubuntu
    steps:
      - uses: actions/checkout@v2

      # on Linux/macOS...
      - name: Download conda_build_config.yaml
        if: matrix.os != 'windows-latest'
        run: |
          curl -sSL \
            https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/master/recipe/conda_build_config.yaml \
            -o conda_build_config.yaml

      # on Windows...
      - name: Download conda_build_config.yaml (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/master/recipe/conda_build_config.yaml' `
            -OutFile conda_build_config.yaml -UseBasicParsing

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          conda-remove-defaults: true
          miniforge-version: latest
          channels: conda-forge,bioconda,tpeulen
          channel-priority: true
          activate-environment: benv

      - name: Display Conda Settings
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash -l' }}
        run: conda info

      - name: Build + Upload Conda Package
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash -l' }}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          mamba install -n benv -y boa conda-build anaconda-client
          mamba run -n benv boa build conda-recipe
          PKG_PATH=$(mamba run -n benv conda-build conda-recipe --output)
          mamba run -n benv anaconda -t "$ANACONDA_TOKEN" upload --user tpeulen --skip-existing "$PKG_PATH"
