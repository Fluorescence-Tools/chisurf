jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v2

      # conda_build_config.yaml download (omitted for brevity)

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          conda-remove-defaults: true
          miniforge-version: latest
          channels: conda-forge,bioconda,tpeulen
          channel-priority: true
          activate-environment: benv

      # Display Conda info on Linux/macOS
      - name: Display Conda Settings (Linux/macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash -el {0}
        run: conda info

      # Display Conda info on Windows
      - name: Display Conda Settings (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: conda info

      # Build + Upload on Linux/macOS
      - name: Build + Upload Conda Package (Linux/macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          mamba install -n benv -y boa conda-build anaconda-client
          mamba run -n benv boa build conda-recipe
          PKG_PATH=$(mamba run -n benv conda-build conda-recipe --output)
          mamba run -n benv anaconda -t "$ANACONDA_TOKEN" upload --user tpeulen --skip-existing "$PKG_PATH"

      # Build + Upload on Windows
      - name: Build + Upload Conda Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          # install tools
          mamba install -n benv -y boa conda-build anaconda-client
          # use boa to build
          mamba run -n benv boa build conda-recipe
          # get output path
          $pkg = mamba run -n benv conda-build conda-recipe --output
          # upload
          mamba run -n benv anaconda -t $env:ANACONDA_TOKEN upload --user tpeulen --skip-existing $pkg
