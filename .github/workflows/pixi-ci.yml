name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [development]
    tags: ["v*"]
  release:
    types: [released, prereleased]
  schedule:
    - cron: "0 11 * * 1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OUT_DIR: conda-bld

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb \
            libgl1-mesa-dev libfuse2

      - name: Set macOS SDK
        if: runner.os == 'macOS'
        run: bash build_tools/install_macos_sdk.sh

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          init-shell: bash

      - name: Install build tools
        shell: bash -l {0}
        run: |
          micromamba create -n build -y -c conda-forge \
            python rattler-build micromamba git pip setuptools wheel \
            cython numpy swig cmake ninja

      - name: Build conda package
        shell: bash -l {0}
        run: |
          micromamba activate build
          CHISURF_VERSION=$(python rattler-recipe/generate_version.py --print)
          echo "CHISURF_VERSION=$CHISURF_VERSION"
          echo "{\"version\": \"$CHISURF_VERSION\"}" > rattler-recipe/version.json
          python rattler-recipe/collect_entry_points.py || true
          rattler-build build --recipe rattler-recipe --output-dir conda-bld --test skip

      - name: Upload conda packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: ${{ env.OUT_DIR }}/**/*.conda

      - name: Build Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_tools\win\build-setup.bat

      - name: Build macOS DMG installer (.dmg)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: bash build_tools/osx/build-osx-app.sh --no-build

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: bash build_tools/linuxdeploy/build.sh --no-build

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.AppImage

  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          path: conda-packages
          pattern: packages-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            conda-packages/**/*.conda
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
