name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [development, main]
    tags: ["v*"]
  release:
    types: [released, prereleased]
  schedule:
    - cron: "0 11 * * 1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OUT_DIR: conda-bld

    steps:

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb \
            libgl1-mesa-dev libfuse2 qtbase5-dev patchelf desktop-file-utils file

      - name: Set macOS SDK
        if: runner.os == 'macOS'
        run: bash build_tools/install_macos_sdk.sh

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          init-shell: bash

      - name: Install build tools
        shell: bash -l {0}
        run: |
          CHANNELS="-c conda-forge"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            CHANNELS="$CHANNELS -c bioconda"
          fi
          micromamba create -n build -y $CHANNELS \
            python=3.12 rattler-build micromamba git pip setuptools wheel \
            cython numpy swig cmake ninja eigen

      - name: Build conda package
        shell: bash -l {0}
        run: |
          micromamba activate build
          CHISURF_VERSION=$(python rattler-recipe/generate_version.py --print)
          echo "CHISURF_VERSION=$CHISURF_VERSION" >> $GITHUB_ENV
          echo "{\"version\": \"$CHISURF_VERSION\"}" > rattler-recipe/version.json
          python rattler-recipe/collect_entry_points.py || true
          python build_tools/run_rattler_build.py

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          micromamba activate build
          bash build_tools/osx/build-osx-app.sh --no-build

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Linux conda packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            ${{ env.OUT_DIR }}/linux-64/**/*.conda
            ${{ env.OUT_DIR }}/noarch/**/*.conda
          if-no-files-found: error

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          micromamba activate build
          bash build_tools/linuxdeploy/build.sh --no-build

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: dist/ChiSurf-x86_64.AppImage
          if-no-files-found: error

      - name: Upload macOS conda packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            ${{ env.OUT_DIR }}/osx-64/**/*.conda
            ${{ env.OUT_DIR }}/osx-arm64/**/*.conda
          if-no-files-found: error

      - name: Upload Windows conda packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: ${{ env.OUT_DIR }}/win-64/**/*.conda
          if-no-files-found: error

      - name: Build Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          micromamba activate build
          export "BASE_CONDA_ROOT=$MAMBA_ROOT_PREFIX"
          build_tools/win/build-setup.bat /nobuild

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts/windows

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts/macos

      - name: Download Linux conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: conda-packages/linux

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux
          path: artifacts/linux

      - name: Download macOS conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-macos
          path: conda-packages/macos

      - name: Download Windows conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: conda-packages/windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux/*.AppImage
            artifacts/macos/*.dmg
            artifacts/windows/*.exe
            conda-packages/**/*.conda
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
