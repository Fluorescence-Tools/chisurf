name: Pixi Build and Release

on:
  workflow_dispatch:
  push:
    branches: [development]
  release:
    types: [released, prereleased]
  schedule:
    # Every Monday at 11:00 UTC
    - cron: "0 11 * * 1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OUT_DIR: conda-bld

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set macOS SDK
        if: runner.os == 'macOS'
        run: bash build_tools/install_macos_sdk.sh

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Build Pixi package
        run: pixi run -e build build-pkg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pixi run -e build build-setup

      - name: Upload to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.OUT_DIR }}/**/*.conda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: ${{ env.OUT_DIR }}/**/*.conda
