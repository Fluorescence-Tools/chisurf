name: Pixi Build and Release

on:
  workflow_dispatch:
  push:
    branches: [development]
    tags: ["v*"]
  release:
    types: [released, prereleased]
  schedule:
    # Every Monday at 11:00 UTC
    - cron: "0 11 * * 1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OUT_DIR: conda-bld

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb \
            libgl1-mesa-dev libfuse2

      - name: Set macOS SDK
        if: runner.os == 'macOS'
        run: bash build_tools/install_macos_sdk.sh

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Build Pixi package
        run: pixi run build-pkg

      - name: Upload conda packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: ${{ env.OUT_DIR }}/**/*.conda

      - name: Build Windows installer (.exe)
        if: runner.os == 'Windows'
        run: pixi run build-setup

      - name: Build macOS DMG installer (.dmg)
        if: runner.os == 'macOS'
        run: pixi run build-osx-app

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: pixi run build-linux-appimage

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.AppImage

  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          path: conda-packages
          pattern: packages-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            conda-packages/**/*.conda
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
