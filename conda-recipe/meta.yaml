{% set name = "chisurf" %}
{% set version = environ.get("CHISURF_VERSION") or datetime.datetime.now().strftime("%y.%m.%d") %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  binary_relocation: true
  detect_binary_files_with_prefix: true  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # Entry points are automatically extracted from pyproject.toml by pip
  # No need to specify them here when using pip install

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake <4
    - ninja
    - make  # [not win]

  host:
    - python
    - git
    - pip
    - setuptools >=61
    - wheel
    - cython >=0.29,<3
    - numpy <2.0  # Pin to NumPy 1.x for Cython compatibility
    - swig <4.3.0
    - pkg-config  # [not win]
    - llvm-openmp  # [osx]
    - libcxx       # [osx]
    - libgomp      # [linux]
    - pyyaml
    # Needed for chinet
    - doxygen
    - boost-cpp
    - pyqt             # provides pyrcc5 for resource build
    - pybind11
    - eigen

    # Windows-only: if you rely on system tttrlib there, keep hdf5 here
    - hdf5  # [win]

  run:
    - python
    - numpy <2.0  # Pin to NumPy 1.x for Cython compatibility
    - typing-extensions >=4.14
    - pytools >=2024.0
    - pyyaml
    - click
    - click-didyoumean
    - qtpy
    - pyqt
    - pyqtgraph
    - matplotlib
    - scikit-image
    - deprecation
    - imp
    - pandas
    - scipy
    - numba
    - boost-cpp
    - mdtraj
    - ipython
    - notebook
    - emcee
    - pyopengl
    - pytables
    - pymol-open-source
    - guidata
    - guiqwt
    - python-docx
    - qtconsole
    - pyqtwebengine
    - hmmlearn
    - sympy
    - zeus-mcmc
    - hdbscan
    - umap-learn
    - tttrlib  # [not win]
    - libcxx   # [osx]

app:
  entry: chisurf
  summary: ChiSurf analysis platform for fluorescence data

test:
  imports:
    - chisurf
  commands:
    - python -c "import chisurf; print(chisurf.__version__)"

about:
  home: https://github.com/Fluorescence-Tools/ChiSurf
  license: GPL-2.1
  license_file: LICENSE
  summary: ChiSurf - an interactive global analysis platform for fluorescence data
  description: >
    ChiSurf is a software package for the global analysis of fluorescence data.
    It enables users to interlink, optimize, and jointly sample variables of models
    for time-resolved single-molecule and ensemble fluorescence experiments.

extra:
  recipe-maintainers:
    - tpeulen
