{% set name = "chisurf" %}
{% set version = os.environ.get("CHISURF_VERSION") %}
{% if not version %}
  {% set version = os.popen("python -c \"import sys, os; sys.path.insert(0, os.path.abspath(os.path.join(r'" ~ RECIPE_DIR ~ "', '..'))); from chisurf.info import __version__; print(__version__)\"").read().strip() %}
{% endif %}
{% if not version %}
  {% set version = datetime.datetime.now().strftime("%y.dev0") %}
{% endif %}

{# Read entry points from pyproject.toml #}
{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set scripts = pyproject.get('project', {}).get('scripts', {}) %}
{% set gui_scripts = pyproject.get('project', {}).get('gui-scripts', {}) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../

build:
  number: 0
  binary_relocation: true
  detect_binary_files_with_prefix: true  # [not win]
  # Entry points dynamically generated from pyproject.toml
  entry_points:
    {% for name, entry in scripts.items() -%}
    - {{ name }} = {{ entry }}
    {% endfor -%}
    {% for name, entry in gui_scripts.items() -%}
    - {{ name }} = {{ entry }}
    {% endfor %}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake <4
    - ninja
    - make  # [not win]

  host:
    - python
    - git
    - pip
    - setuptools >=61
    - wheel
    - cython >=0.29,<3
    - numpy <2.0  # Pin to NumPy 1.x for Cython compatibility
    - swig <4.3.0
    - pkg-config  # [not win]
    - llvm-openmp  # [osx]
    - libcxx       # [osx]
    - libgomp      # [linux]
    - boost-cpp    # Needed for chinet
    - doxygen
    - pyqt         # provides pyrcc5 for resource build
    - pybind11
    - eigen

    # Windows-only: if you rely on system tttrlib there, keep hdf5 here
    - hdf5  # [win]

  run:
    - python
    - numpy <2.0  # Pin to NumPy 1.x for Cython compatibility
    - typing-extensions >=4.14
    - pytools >=2024.0
    - pyyaml
    - markdown
    - click
    - click-didyoumean
    - qtpy
    - pyqt
    - pyqtgraph 0.13.*
    - matplotlib
    - scikit-image
    - deprecation
    - imp
    - pandas
    - scipy
    - numba
    - boost-cpp
    - mdtraj
    - ipython
    - notebook
    - emcee
    - pyopengl
    - pytables
    - guidata
    - guiqwt
    - python-docx
    - qtconsole
    - pyqtwebengine
    - hmmlearn
    - sympy
    - zeus-mcmc
    - tttrlib  # [not win]
    - libcxx   # [osx]
    - micromamba
    - pygments
    - pyarrow
    - boost-histogram

    # Windows-only: if you rely on system tttrlib there, keep hdf5 here
    - hdf5  # [win]

app:
  entry: chisurf
  summary: ChiSurf analysis platform for fluorescence data

test:
  imports:
    - chisurf
  commands:
    - python -c "import chisurf; print(chisurf.__version__)"

about:
  home: https://github.com/Fluorescence-Tools/ChiSurf
  license: GPL-2.0
  license_file: LICENSE
  summary: ChiSurf - an interactive global analysis platform for fluorescence data
  description: >
    ChiSurf is a software package for the global analysis of fluorescence data.
    It enables users to interlink, optimize, and jointly sample variables of models
    for time-resolved single-molecule and ensemble fluorescence experiments.

extra:
  recipe-maintainers:
    - tpeulen
