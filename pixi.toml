[workspace]
name = "chisurf"
version = "26.dev0"
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
authors = ["Thomas-Otavio Peulen <thomas@peulen.xyz>"]
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[environments]
default = []
build = ["build"]
test = ["build", "test"]
dev = ["build", "test", "dev"]
docs = ["docs"]

[dependencies]
python = "3.12.*"
numpy = "*"
typing-extensions = ">=4.14"
pytools = ">=2024.0"
pyyaml = "*"
markdown = "*"
click = "*"
click-didyoumean = "*"
qtpy = "<2.0"
pyqt = "*"
pyqtgraph = "0.13.*"
matplotlib = "*"
scikit-image = "*"
deprecation = "*"
pandas = "*"
scipy = "*"
numba = "*"
boost-cpp = "*"
mdtraj = "*"
pdb2pqr = "*"
ipython = "*"
notebook = "<7"
emcee = "*"
pyopengl = "*"
pytables = "*"
guidata = "*"
guiqwt = "*"
python-docx = "*"
qtconsole = "*"
hmmlearn = "*"
latexify-py = "*"
pygments = "*"
pyarrow = "*"
boost-histogram = "*"
sqlalchemy = ">=2.0"

[pypi-dependencies]

[pypi-options]
dependency-overrides = { "numpy" = {} }

[feature.build.dependencies]
rattler-build = ">=0.58.0"
cmake = "<4"
ninja = "*"
setuptools = "*"
wheel = "*"
pip = ">=26.0.1,<27"
git = "*"
rattler-index = "*"
jinja2 = "*"
tomli = "*"
micromamba = "*"
eigen = ">=5.0.1,<6"
pybind11 = ">=3.0.3,<4"
cmake-build-extension = ">=0.6.1,<0.7"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
python-lsp-server = ">=1.14"

[feature.build.tasks]
build-pkg = { cmd = "python build_tools/run_rattler_build.py", depends-on = ["build-extensions"] }
build-setup = { cmd = "python build_tools/win/build_setup.py /nobuild", depends-on = ["build-pkg"] }
build-osx-app = { cmd = "bash build_tools/osx/build-osx-app.sh --no-build", depends-on = ["build-pkg"] }
build-linux-appimage = { cmd = "bash build_tools/linuxdeploy/build.sh --no-build", depends-on = ["build-pkg"] }

[feature.docs.pypi-dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
numpydoc = "*"
sphinx-autodoc-typehints = "*"
myst-parser = "*"

[feature.docs.tasks]
docs-plugins = { cmd = "python build_tools/docs/generate_plugin_docs.py" }
docs-manual = { cmd = "python build_tools/docs/convert_manual.py" }
docs-clean = { cmd = "rm -rf docs/_build" }
docs-html = { depends-on = ["docs-manual", "docs-plugins"], cmd = "sphinx-build -E -b html docs docs/_build" }

[target.win-64.dependencies]
hdf5 = "*"
cmake = "<4"
ninja = "*"

[target.linux-64.dependencies]
hdf5 = "*"
tttrlib = "*"

[target.osx-64.dependencies]
tttrlib = "*"

[target.osx-arm64.dependencies]
tttrlib = "*"

 [tasks]
 build-appimage = { cmd = "bash build_tools/linuxdeploy/build.sh" }
 test-chinet = { cmd = "python -m pytest modules/chinet/test -x -q" }
 build-ndxplorer = { cmd = "export CMAKE_ARGS=\"-DEigen3_DIR=$CONDA_PREFIX/share/eigen3/cmake -DEigen3_INCLUDE_DIR=$CONDA_PREFIX/include/eigen3\" && pip install -e modules/ndxplorer --no-deps", inputs = [
     "modules/ndxplorer/CMakeLists.txt",
     "modules/ndxplorer/setup.py",
 ] }
 build-clsmview = { cmd = "pip install -e modules/clsmview --no-deps", inputs = [     "modules/clsmview/setup.py",
     "modules/clsmview/clsmview/**",
 ] }
 build-quest = { cmd = "pip install -e modules/quest --no-deps", inputs = [
     "modules/quest/pyproject.toml",
     "modules/quest/quest/**",
 ] }
 build-chinet = { cmd = "pip install -e modules/chinet --no-deps", inputs = [
     "modules/chinet/setup.py",
     "modules/chinet/pyproject.toml",
     "modules/chinet/chinet/**",
     ] }
     build-extensions = { depends-on = [
     "build-ndxplorer",
     "build-clsmview",
     "build-quest",
     "build-chinet",
 ] }
 chisurf = { cmd = "python -m chisurf" }

test-app-linux = { cmd = "echo 'test-app-linux: requires native pixi environment on Linux'", depends-on = ["build-extensions"] }
test = { cmd = "pytest test $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'not gui and not widget and not window'", depends-on = ["build-extensions"] }
test-gui = { cmd = "pytest $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'widget or gui'", depends-on = ["build-extensions"] }
test-doctest = { cmd = "pytest test --doctest-modules", depends-on = ["build-extensions"] }
lint = { cmd = "ruff check chisurf/ test/ && ruff format --check chisurf/ test/" }
fmt = { cmd = "ruff format chisurf/ test/ && ruff check --fix chisurf/ test/" }
typecheck = { cmd = "mypy chisurf/" }
test-cov = { cmd = "pytest test --doctest-modules $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests --cov=chisurf --cov-report=term --cov-report=xml --cov-report=html", depends-on = ["build-extensions"] }
test-linux = { cmd = "docker build -t chisurf-linux -f Dockerfile.linux . && docker run --rm chisurf-linux" }
test-smoke = { cmd = "pytest test/test_basic.py -q", depends-on = ["build-extensions"] }

[build-dependencies]
cmake-build-extension = ">=0.6.1,<0.7"
cmake = ">=3.31.8,<4"
swig = ">=4.4.0,<5"
ninja = ">=1.13.2,<2"
numpy = ">=2.4.3,<3"
python = ">=3.12.13,<3.13"
scikit-build-core = ">=0.12.1,<0.13"
pybind11 = ">=3.0.3,<4"
llvm-openmp = ">=22.1.3,<23"

[target.win-64.tasks]
