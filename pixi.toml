[workspace]
name = "chisurf"
version = "26.dev0"
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
authors = ["Thomas-Otavio Peulen <thomas@peulen.xyz>"]
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[environments]
default = ["build"]

[dependencies]
python = "3.12.*"
numpy = "*"
cmake = "<4"
ninja = "*"
typing-extensions = ">=4.14"
pytools = ">=2024.0"
pyyaml = "*"
markdown = "*"
click = "*"
click-didyoumean = "*"
qtpy = "<2.0"
pyqt = "*"
pyqtwebengine = "*"
pyqtgraph = "0.13.*"
matplotlib = "*"
scikit-image = "*"
deprecation = "*"
pandas = "*"
scipy = "*"
numba = "*"
boost-cpp = "*"
mdtraj = "*"
ipython = "*"
notebook = "*"
emcee = "*"
pyopengl = "*"
pytables = "*"
guidata = "*"
guiqwt = "*"
python-docx = "*"
qtconsole = "*"
hmmlearn = "*"
sympy = "*"
zeus-mcmc = "*"
pygments = "*"
pyarrow = "*"
boost-histogram = "*"
fastmcp = ">=3.1.0,<4"
setuptools = ">=82.0.1,<83"
pymol-open-source = "*"
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"
ruff = "*"
mypy = "*"
pip = "*"

[pypi-dependencies]
tttrlib = { version = "*", env-markers = "sys_platform == 'win32'" }
chinet = { path = "modules/chinet", editable = true }
labellib = { path = "modules/labellib", editable = true }
ndxplorer = { path = "modules/ndxplorer", editable = true }
clsmview = { path = "modules/clsmview", editable = true }
quest = { path = "modules/quest", editable = true }

[pypi-options]
dependency-overrides = { "pymol-open-source" = {}, "numpy" = {} }

[feature.build.dependencies]
rattler-build = ">=0.58.0"
cmake = "<4"
ninja = "*"
setuptools = "*"
wheel = "*"
pip = ">=26.0.1,<27"
git = "*"
rattler-index = "*"
jinja2 = "*"
tomli = "*"
micromamba = "*"

[feature.build.tasks]
build-pkg = { cmd = "python build_tools/run_rattler_build.py", depends-on = ["build-extensions"] }
build-setup = { cmd = "python build_tools/win/build_setup.py /nobuild", depends-on = ["build-pkg"] }
build-osx-app = { cmd = "bash build_tools/osx/build-osx-app.sh --no-build", depends-on = ["build-pkg"] }
build-linux-appimage = { cmd = "bash build_tools/linuxdeploy/build.sh --no-build", depends-on = ["build-pkg"] }

[target.win-64.dependencies]
hdf5 = "*"
cmake = "<4"
ninja = "*"

[target.linux-64.dependencies]
hdf5 = "*"
tttrlib = "*"

[target.osx-64.dependencies]
tttrlib = "*"

[target.osx-arm64.dependencies]
tttrlib = "*"

[tasks]
test-chinet = { cmd = "python -m pytest modules/chinet/test -x -q" }
build-tttrlib = { cmd = "true" }
build-labellib = { cmd = "python -m pip install -e modules/labellib --no-deps", inputs = [
    "modules/labellib/CMakeLists.txt",
    "modules/labellib/FlexLabel/**",
    "modules/labellib/setup.py",
] }
build-ndxplorer = { cmd = "python -m pip install -e modules/ndxplorer --no-deps", inputs = [
    "modules/ndxplorer/pyproject.toml",
    "modules/ndxplorer/ndxplorer/**",
] }
build-clsmview = { cmd = "python -m pip install -e modules/clsmview --no-deps", inputs = [
    "modules/clsmview/setup.py",
    "modules/clsmview/clsmview/**",
] }
build-quest = { cmd = "python -m pip install -e modules/quest --no-deps", inputs = [
    "modules/quest/pyproject.toml",
    "modules/quest/quest/**",
] }
build-chinet = { cmd = "true" }
build-extensions = { depends-on = [
    "build-tttrlib",
    "build-labellib",
    "build-ndxplorer",
    "build-clsmview",
    "build-quest",
    "build-chinet",
] }
chisurf = { cmd = "python -m chisurf" }

test-app-linux = { cmd = "echo 'test-app-linux: requires native pixi environment on Linux'", depends-on = ["build-extensions"] }
test = { cmd = "pytest test -k 'not gui and not widget and not window'", depends-on = ["build-extensions"] }
test-gui = { cmd = "pytest test/gui", depends-on = ["build-extensions"] }
lint = { cmd = "ruff check chisurf/ test/ && ruff format --check chisurf/ test/" }
fmt = { cmd = "ruff format chisurf/ test/ && ruff check --fix chisurf/ test/" }
typecheck = { cmd = "mypy chisurf/" }
test-cov = { cmd = "pytest --cov=chisurf --cov-report=term --cov-report=xml --cov-report=html", depends-on = ["build-extensions"] }
test-linux = { cmd = "docker build -t chisurf-linux -f Dockerfile.linux . && docker run --rm chisurf-linux" }
test-smoke = { cmd = "pytest test/test_basic.py -q", depends-on = ["build-extensions"] }

[target.win-64.tasks]
