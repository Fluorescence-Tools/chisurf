[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "numpy<2.0",
]
build-backend = "_build_backend"
backend-path = ["build_tools"]

[project]
name = "chisurf"
dynamic = ["version"]
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-2.0"}
authors = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
maintainers = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
keywords = ["fluorescence", "single-molecule", "spectroscopy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PyQt5",
    "qtpy",
    "sip",
    "pyqtgraph",
    "qtconsole",
    "numba",
    "numpy<2.0",
    "numexpr",
    "scipy",
    "deprecation",
    "emcee",
    "PyYAML",
    "typing-extensions",
    "tables",
    "matplotlib",
    "python-docx",
    "mdtraj",
    "ipython",
    "click",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.0.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
mcp = [
    "fastmcp",
]

[project.urls]
Homepage = "https://www.peulen.xyz/downloads/chisurf"
Documentation = "https://github.com/Fluorescence-Tools/chisurf/wiki"
Repository = "https://github.com/Fluorescence-Tools/chisurf"
"Bug Tracker" = "https://github.com/Fluorescence-Tools/chisurf/issues"

[project.scripts]
csc = "chisurf.cli:cli"

[project.gui-scripts]
chisurf = "chisurf.__main__:main"
csg_kappa2distribution = "chisurf.plugins.kappa2_dist.__main__:main"
csg_fps_json_edit = "chisurf.plugins.modelling.fps_json_editor.__main__:main"
csg_calculator = "chisurf.plugins.fret_calculator.__main__:main"
csg_f_test = "chisurf.plugins.misc.f_test.__main__:main"
csg_traj_align = "chisurf.plugins.traj.traj_align.__main__:main"
csg_traj_convert = "chisurf.plugins.traj.traj_convert.__main__:main"
csg_traj_fret_analysis = "chisurf.plugins.traj.fret_trajectory.__main__:main"
csg_traj_join = "chisurf.plugins.traj.traj_join.__main__:main"
csg_traj_energy_calculator = "chisurf.plugins.traj.potential_energy.__main__:main"
csg_traj_remove_clashed_frames = "chisurf.plugins.traj.traj_remove_clashes.__main__:main"
csg_traj_rotate_translate = "chisurf.plugins.traj.traj_rotate_translate.__main__:main"
csg_traj_save_topology = "chisurf.plugins.traj.traj_save_topology.__main__:main"
csg_quest = "quest.quest_gui:start_gui"
csg_ndxplorer = "ndxplorer.__main__:main"
csg_trace_browser = "chisurf.plugins.trace_browser.__main__:main"
csg_tttr_image_browser = "chisurf.plugins.tttr_image_browser.__main__:main"
chisurf_update = "chisurf.plugins.updater.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["chisurf*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "*.json", "*.yaml",
    "*.ui", "*.css", "*.qss",
    "*.png", "*.svg",
    "*.csv", "*.npy", "*.dat",
    "*.dll", "*.so", "*.pyd", "*.ipynb",
    "*.db", "*.txt"
]

[tool.setuptools.dynamic]
version = {attr = "chisurf.info.__version__"}

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore-glob=**/_old --ignore-glob=**/_dev_* --ignore-glob=**/_broken --ignore-glob=chisurf/* --ignore-glob=rattler-recipe/* --ignore-glob=build_tools/* --ignore-glob=**/test_gui_*.py --ignore-glob=**/test_widget_*.py --ignore-glob=**/test_all_plugins.py"
norecursedirs = ["build_tools", "modules", "conda-bld", ".pixi", "dist", "chisurf", "rattler-recipe"]
testpaths = ["unittests", "test"]
