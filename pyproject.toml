[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "numpy<2.0",
    "Cython>=0.29,<3.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "chisurf"
dynamic = ["version"]
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0"
authors = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
maintainers = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
keywords = ["fluorescence", "single-molecule", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PyQt5",
    "qtpy",
    "sip",
    "pyqtgraph",
    "qtconsole",
    "numba",
    "numpy<2.0",
    "numexpr",
    "scipy",
    "labellib",
    "deprecation",
    "emcee",
    "PyYAML",
    "packaging",
    "typing-extensions",
    "tables",
    "matplotlib",
    "python-docx",
    "mdtraj",
    "ipython",
    "click",
    "pyzmq>=25.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.0.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "mypy",
    "ruff",
]
cli = [
    "ptpython>=3.0",
]

[project.urls]
Homepage = "https://www.peulen.xyz/downloads/chisurf"
Documentation = "https://github.com/Fluorescence-Tools/chisurf/wiki"
Repository = "https://github.com/Fluorescence-Tools/chisurf"
"Bug Tracker" = "https://github.com/Fluorescence-Tools/chisurf/issues"

[project.scripts]
csc = "chisurf.cli:cli"
chimol-cli = "chisurf.plugins.chimol.chimol.app.cli:main"

[project.gui-scripts]
chisurf = "chisurf.__main__:main"
csg_kappa2distribution = "chisurf.plugins.kappa2_dist.__main__:main"
csg_fps_json_edit = "chisurf.plugins.modelling.fps_json_editor.__main__:main"
csg_calculator = "chisurf.plugins.fret_calculator.__main__:main"
csg_f_test = "chisurf.plugins.misc.f_test.__main__:main"
csg_traj_align = "chisurf.plugins.traj.traj_align.__main__:main"
csg_traj_convert = "chisurf.plugins.traj.traj_convert.__main__:main"
csg_traj_fret_analysis = "chisurf.plugins.traj.fret_trajectory.__main__:main"
csg_traj_join = "chisurf.plugins.traj.traj_join.__main__:main"
csg_traj_energy_calculator = "chisurf.plugins.traj.potential_energy.__main__:main"
csg_traj_remove_clashed_frames = "chisurf.plugins.traj.traj_remove_clashes.__main__:main"
csg_traj_rotate_translate = "chisurf.plugins.traj.traj_rotate_translate.__main__:main"
csg_traj_save_topology = "chisurf.plugins.traj.traj_save_topology.__main__:main"
csg_quest = "quest.quest_gui:start_gui"
csg_ndxplorer = "ndxplorer.__main__:main"
csg_trace_browser = "chisurf.plugins.trace_browser.__main__:main"
csg_tttr_image_browser = "chisurf.plugins.tttr_image_browser.__main__:main"
chisurf_update = "chisurf.plugins.updater.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["chisurf*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "*.json", "*.yaml",
    "*.ui", "*.css", "*.qss",
    "*.png", "*.svg",
    "*.csv", "*.npy", "*.dat",
    "*.dll", "*.so", "*.pyd", "*.ipynb",
    "*.db", "*.txt"
]
"chisurf.settings.constants" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "chisurf.info.__version__"}

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=chisurf --cov-report=html"
norecursedirs = ["build_tools", "modules", "conda-bld", ".pixi", "dist", "chisurf", "rattler-recipe", "repro"]
testpaths = ["test"]
markers = [
    "slow: marks tests as slow (reader-heavy) and excluded from default runs",
]

[tool.pytest-cov]
# Minimum coverage thresholds as defined in the test coverage plan
# >80% for core logic, >60% for GUI
[tool.pytest-cov.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Covered"

[tool.pytest-cov.html]
directory = "htmlcov"
show_contexts = true

[tool.pytest-cov.coverage]
# Enforce minimum coverage thresholds
# These thresholds will be enforced in CI/CD pipelines
[tool.pytest-cov.coverage.run]
source = ["chisurf"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/build_tools/*",
    "*/rattler-recipe/*",
]

[tool.pytest-cov.coverage.fail_under]
# Target coverage thresholds from the test coverage plan
# >80% for core logic, >60% for GUI
# We'll set a conservative overall threshold of 70% to start
# and can be adjusted based on actual coverage analysis
min = 70

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "D",   # pydocstyle — docstring conventions (NumPy-style)
]
ignore = [
    "E501",  # line too long, let formatter handle it
    "D100",  # missing docstring in public module (handled per-module)
    "D104",  # missing docstring in public package (noise for __init__ stubs)
    "D107",  # missing docstring in __init__ (redundant with class docstring)
    "D203",  # 1 blank line before class docstring (conflicts with D211)
    "D212",  # multi-line summary first line (conflicts with D213)
    "D213",  # multi-line summary second line (we use NumPy style)
    "D402",  # first line not function signature (handled by convention)
    "D404",  # first word not "This" (numspy style allows this)
    "D407",  # dashed line under section headers (NumPy style uses dashes)
    "D408",  # section underline matches length (NumPy style doesn't require this)
    "D409",  # section underline matches dashes (NumPy style)
    "D410",  # blank line after section (NumPy style uses blank lines)
    "D411",  # blank line before section (NumPy style)
    "D412",  # no blank lines between header/content (NumPy style)
    "D413",  # blank line after last section (NumPy style)
    "D414",  # non-empty docstring should have description (fine)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
